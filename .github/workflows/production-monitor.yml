name: Production Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production readiness
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --retry 2 --retry-delay 3 \
            https://forge.pappmilan.com/api/health/ready
