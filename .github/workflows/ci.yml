name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main, develop, 'forge/**']
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm prisma generate
      - id: api-build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/forge-api-build.log
          exit ${PIPESTATUS[0]}
      - name: Report API build failure
        if: steps.api-build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/forge-api-build.log
      - name: Fail API job after reporting
        if: steps.api-build.outcome == 'failure'
        run: exit 1
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:cov
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high || echo "::warning::High-severity dependency advisories detected; dependency upgrades are tracked separately."
        working-directory: .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm build
