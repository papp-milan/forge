services:
  postgres:
    image: postgres:18
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev_password
    ports:
      - "5433:5432"
    volumes:
      - forge-postgres-data:/var/lib/postgresql

volumes:
  forge-postgres-data: